<section class="main-page">
  <h1>Welcome to the Microfrontend Shell</h1>
  <p>Choose a microfrontend below, or use the navigation bar above.</p>

  <div class="card-grid">
    @for (mfe of microfrontends; track mfe.path) {
      <mat-card appearance="outlined" class="mfe-card">
        <mat-card-header>
          <mat-icon mat-card-avatar>{{ mfe.icon }}</mat-icon>
          <mat-card-title>{{ mfe.title }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>{{ mfe.description }}</p>
        </mat-card-content>
        <mat-card-actions align="end">
          <a mat-button color="primary" [routerLink]="mfe.path">Open</a>
        </mat-card-actions>
      </mat-card>
    }
  </div>
</section>
