<section class="people-list">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search</mat-label>
    <input
      matInput
      #searchInput
      placeholder="Search by name, citizenship, gender, country…"
      (keyup)="applyFilter(searchInput.value)"
    />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort class="people-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let person">{{ person.name }}</td>
      </ng-container>

      <ng-container matColumnDef="citizenship">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Citizenship</th>
        <td mat-cell *matCellDef="let person">{{ person.citizenship }}</td>
      </ng-container>

      <ng-container matColumnDef="dateOfBirth">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Date of birth</th>
        <td mat-cell *matCellDef="let person">{{ person.dateOfBirth | date: 'mediumDate' }}</td>
      </ng-container>

      <ng-container matColumnDef="gender">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Gender</th>
        <td mat-cell *matCellDef="let person">{{ person.gender }}</td>
      </ng-container>

      <ng-container matColumnDef="countryOfResidence">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Country of residence</th>
        <td mat-cell *matCellDef="let person">{{ person.countryOfResidence }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row no-data-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">No people match the filter.</td>
      </tr>
    </table>
  </div>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="10" showFirstLastButtons></mat-paginator>
</section>
